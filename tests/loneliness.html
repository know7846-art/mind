<body>

<div class="wrap test-page">

<script>
const opts4 = [
  { label: '전혀 그렇지 않다', score: 0 },
  { label: '가끔 그렇다', score: 1 },
  { label: '자주 그렇다', score: 2 },
  { label: '항상 그렇다', score: 3 }
];
const TEST_CONFIG = {
  id: 'loneliness',
  gaugeLabel: '외로움 지수',
  intro: {
    emoji: '🫧',
    badge: 'CONNECTION', badgeBg: '#E1F8F3', badgeColor: '#1D7F88',
    title: '나 지금 외로운 거 맞아?',
    hook: '친구는 많은데 왠지 모르게 허전할 때, 그 감정에 이름을 붙여보면 마음이 한결 가벼워져요. 솔직하게 6개만 골라볼까요?',
    checklist: ['나의 외로움 지수 (0~18)', '지금 내 상태에 맞는 한 줄 메시지', '필요할 때 도움받을 수 있는 곳'],
    cta: '내 외로움 지수 확인하기 →'
  },
  basis: `이 검사는 표준 임상 척도(<b>UCLA 외로움 척도</b> 등)가 다루는 "정서적 연결감 결여", "혼자라는 느낌", "이야기 나눌 대상의 부재" 같은 핵심 개념을 참고해서, 저희가 청소년·청년 눈높이에 맞춰 새로 쓴 6문항입니다.
    <ul>
      <li>표준화된 검증(신뢰도·타당도 검사)을 거친 정식 심리검사가 <b>아니며</b>, 의학적 진단 도구가 아닙니다.</li>
      <li>결과는 참고용이며, 점수보다 "내 마음을 한 번 들여다봤다"는 것 자체에 의미가 있어요.</li>
      <li>더 정확한 상태 확인이나 도움이 필요하다면 부천시청소년상담복지센터 전문 상담사와 이야기해보세요.</li>
    </ul>`,
  questions: [
    { text: '요즘 나를 진짜 이해해주는 사람이 없다고 느낀다.', options: opts4 },
    { text: '누군가와 함께 있어도 혼자인 것 같다.', options: opts4 },
    { text: '힘든 일이 생겼을 때 편하게 연락할 사람이 떠오르지 않는다.', options: opts4 },
    { text: '주변 사람들과 거리감이 느껴진다.', options: opts4 },
    { text: '요즘 마음을 나눌 대화가 부족하다고 느낀다.', options: opts4 },
    { text: '혼자라는 느낌 때문에 기분이 가라앉을 때가 있다.', options: opts4 }

  bands: [
    { max: 4,  emoji: '🌿', label: '연결감이 좋은 편이에요', desc: '지금처럼 주변 사람들과의 관계를 잘 챙겨나가고 있어요. 가끔 외로움이 스칠 땐 이 페이지를 다시 찾아주세요.' },
    { max: 9,  emoji: '🫧', label: '가끔 외로움을 느끼고 있어요', desc: '누구나 느낄 수 있는 자연스러운 감정이에요. 믿을 수 있는 사람과 짧은 대화를 나눠보는 것도 좋아요.' },
    { max: 14, emoji: '🌧️', label: '외로움이 꽤 자주 찾아오는 것 같아요', desc: '혼자 견디기보다, 마음을 나눌 수 있는 곳에 이야기해보는 걸 추천해요. 센터 선생님들이 편하게 들어드려요.' },
    { max: 18, emoji: '💙', label: '많이 외로웠겠어요, 혼자 두지 마세요', desc: '지금 느끼는 외로움, 결코 이상한 게 아니에요. 부천시청소년상담복지센터에서 함께 이야기 나눠봐요.' }
  ]
};
runTest(TEST_CONFIG);
</script>
