<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>스트레스 자가체크 - 마음체크</title>
<link rel="stylesheet" href="../css/hub.css?v=5">
</head>
<body>
<div class="bg-blob-layer"><span class="bg-blob b1"></span><span class="bg-blob b2"></span><span class="bg-blob b3"></span></div>
<div class="wrap test-page">
  <a class="back-link" href="../index.html">← 마음체크 홈</a>
  <div id="app"></div>
  <p class="disclaimer">본 검사는 의학적 진단이 아닌 간이 자가 점검 도구입니다.</p>
</div>
<script src="../js/hub-core.js?v=2"></script>
<script src="../js/test-engine.js?v=2"></script>
<script>
const opts4 = [
  { label: '전혀 그렇지 않다', score: 0 },
  { label: '가끔 그렇다', score: 1 },
  { label: '자주 그렇다', score: 2 },
  { label: '항상 그렇다', score: 3 }
];
const TEST_CONFIG = {
  id: 'stress',
  gaugeLabel: '스트레스 지수',
  intro: {
    emoji: '⚡',
    icon: '../images/stress.svg',
    badge: 'PRESSURE', badgeBg: '#FFF4DC', badgeColor: '#9A6100',
    title: '나의 스트레스 게이지는 몇 %?',
    hook: '요즘 유독 예민해지거나 몸이 무거운 것 같다면, 스트레스가 슬쩍 쌓이고 있는 신호일 수 있어요. 6문항으로 게이지를 확인해봐요.',
    checklist: ['나의 스트레스 게이지 (0~18)', '지금 컨디션에 맞는 한 줄 조언', '필요할 때 도움받을 수 있는 곳'],
    cta: '내 스트레스 게이지 보기 →'
  },
  basis: `이 검사는 <b>지각된 스트레스 척도(PSS, Perceived Stress Scale)</b> 등이 다루는 "통제감 상실", "압박감", "신체 증상" 같은 개념을 참고해서, 저희가 새로 작성한 6문항이에요.
    <ul>
      <li>PSS 원척도를 그대로 사용한 것이 아니라, 문항·채점 기준을 자체 제작했습니다. 표준화된 정식 심리검사가 아닙니다.</li>
      <li>의학적 진단이나 치료 필요성 판단에는 사용할 수 없어요.</li>
      <li>스트레스가 오래 지속된다면 부천시청소년상담복지센터에서 함께 원인을 찾아볼 수 있어요.</li>
    </ul>`,
  questions: [
    { text: '요즘 별일 아닌데도 쉽게 짜증이 난다.', options: opts4 },
    { text: '해야 할 일들이 버겁게 느껴진다.', options: opts4 },
    { text: '몸이 쉽게 피곤하고 잠을 자도 개운하지 않다.', options: opts4 },
    { text: '집중이 잘 안 되고 머리가 복잡하다.', options: opts4 },
    { text: '누군가 나를 다그치는 것 같은 압박감을 느낀다.', options: opts4 },
    { text: '스트레스 때문에 몸이 아프거나 두통이 있다.', options: opts4 }
  ],
  bands: [
    { max: 4,  emoji: '🍃', label: '스트레스 관리가 잘 되고 있어요', desc: '지금의 컨디션을 잘 유지하고 있어요. 나만의 스트레스 해소법을 계속 챙겨보세요.' },
    { max: 9,  emoji: '⚡', label: '스트레스가 조금씩 쌓이고 있어요', desc: '적당한 휴식이 필요한 시기예요. 짧게라도 나를 위한 시간을 가져보세요.' },
    { max: 14, emoji: '🌪️', label: '스트레스가 꽤 높은 편이에요', desc: '혼자 감당하기 버거울 수 있어요. 편하게 이야기할 곳을 찾아보는 걸 추천해요.' },
    { max: 18, emoji: '🔥', label: '스트레스가 많이 쌓여있어요, 도움을 받아보세요', desc: '지금 느끼는 압박감, 혼자 견디지 않아도 돼요. 부천시청소년상담복지센터에서 함께 풀어가봐요.' }
  ]
};
runTest(TEST_CONFIG);
</script>
</body>
</html>
